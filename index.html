<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<style>

#ctl button.g{background:var(--card);color:var(--tx);flex:.5}
#ctl button:disabled{opacity:.45}

#ov button{background:var(--ac);border:0;border-radius:8px;padding:12px 28px;font-size:18px;font-weight:700}
#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(#1f2b1b,#0f150d);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.scr{display:none;flex-direction:column;gap:12px;width:100%;max-width:420px;margin:auto}.scr.on{display:flex}
.scr h1{text-align:center;margin:0 0 10px;font-size:32px;color:var(--ac);line-height:1.15}.scr h2{text-align:center;margin:0;font-size:22px}
.mb{background:var(--card);color:var(--tx);border:2px solid #3c4b36;border-radius:12px;padding:16px;font-size:18px;font-weight:700}.mb.p{background:var(--ac);color:#1b1b10;border:0}
#gear{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;font-size:30px;background:none;border:0;color:var(--tx);padding:6px}
.mc{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px;color:var(--tx);text-align:left}.mc:active{border-color:var(--ac)}
.mc svg{width:110px;height:100px;background:#4a6b35;border-radius:6px;flex:none}.mc b{font-size:17px}.mc span{font-size:13px;opacity:.85;display:block;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:12px;font-size:14px}
.row button{background:var(--ac);color:#1b1b10;border:0;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap}.row button:disabled{opacity:.4}
.tabs{display:flex;gap:6px}.tab{flex:1;background:var(--card);color:var(--tx);border:2px solid transparent;border-radius:10px;padding:10px 2px;font-size:13px;font-weight:700}.tab.on{border-color:var(--ac)}
.fl{position:relative;overflow:hidden;background:var(--ac);color:#1b1b10;border-radius:8px;padding:10px;font-weight:700;text-align:center;cursor:pointer;font-size:14px}.fl input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style></head><body>
<div id="hud"><span id="m">💰 150</span><span id="h">🏠 20</span><span id="w">Волна 0</span></div>
<canvas id="c" width="600" height="550"></canvas>
<div id="pn"></div>
<div id="tools"></div>
<div id="ctl"><button id="go">▶ Начать волну</button><button class="g" id="sp">x1</button><button class="g" id="mn" onclick="pauseM()">☰</button></div>
<div id="ov"><div id="ot"></div><button onclick="reset()">Заново</button><button onclick="toMenu()">В меню</button></div>
<div id='pz' style='position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px'><div style='display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px'><h2 style='text-align:center;margin:0'>⏸ Пауза</h2><button class='mb p' onclick='pzResume()'>▶ Продолжить</button><button class='mb' onclick='pzMenu()'>🏠 Выйти в меню</button><button class='mb' id='sb' style='background:#7a2d2d' onclick='pzSurr(this)'>🏳 Сдаться</button></div></div>
<div id='menu'><button id='gear' onclick='openSet()'>⚙</button>
<div class='scr on' id='m-main'><h1>🪖 ОБОРОНА<br>БАЗЫ</h1><button class='mb p' id='cont' onclick='contGame()' style='display:none'>⏯ Продолжить</button><button class='mb p' onclick='openMaps()'>▶ Старт</button><button class='mb' onclick='openEq()'>🎒 Экипировка</button><button class='mb' onclick='openUp()'>⬆ Улучшения</button><button class='mb' onclick='openShop()'>🛒 Магазин</button><button class='mb' onclick='openPrem()' style='border-color:#8e6be0'>💎 Премиум</button><button class='mb' onclick='openProf()'>👤 Профиль</button><div id='mcoins' style='text-align:center;opacity:.8'></div></div>
<div class='scr' id='m-maps'><h2>Выберите карту</h2><div id='mapl' style='display:flex;flex-direction:column;gap:10px'></div><button class='mb' onclick="show('m-main')">← Назад</button></div>
<div class='scr' id='m-shop'><h2>🛒 Магазин</h2><div id='shl' style='display:flex;flex-direction:column;gap:10px'></div><button class='mb' onclick="show('m-main')">← Назад</button></div>
<div class='scr' id='m-eq'><h2>🎒 Экипировка</h2><div id='eql' style='display:flex;flex-direction:column;gap:10px'></div><button class='mb' data-s='m-main' onclick='show(this.dataset.s)'>← Назад</button></div>

<div class='scr' id='m-prof'><h2>👤 Профиль</h2><div id='prl' style='display:flex;flex-direction:column;gap:10px'></div><button class='mb' onclick="show('m-main')">← Назад</button></div>
<div class='scr' id='m-set'><h2>⚙ Настройки</h2><div id='stl' style='display:flex;flex-direction:column;gap:10px'></div><button class='mb' onclick="show('m-main')">← Назад</button></div>
</div>
<script>
const C=50,cv=document.getElementById('c'),g=cv.getContext('2d');
let P,pathCells,pts,curMap,inMenu=true;



const U={
 sol:{n:'Солдат',e:'🪖',cost:50,r:100,d:8,rate:.5,col:'#6b8e3d'},
 mg:{n:'Пулемёт',e:'🔫',cost:100,r:90,d:4,rate:.12,col:'#8a6d3b'},
 sn:{n:'Снайпер',e:'🎯',cost:150,r:220,d:45,rate:1.8,col:'#3d6e8e'},
 mo:{n:'Миномёт',e:'💣',cost:200,r:170,d:30,rate:2.2,splash:55,col:'#8e3d6b'}
};
const E={
 inf:{hp:30,sp:40,rw:8,dm:1,col:'#c0392b',s:9},
 jeep:{hp:25,sp:85,rw:10,dm:1,col:'#e67e22',s:11},
 tank:{hp:160,sp:28,rw:25,dm:3,col:'#7f1d1d',s:15,sh:'r'},
 boss:{hp:900,sp:22,rw:150,dm:10,col:'#6a1b9a',s:22,em:'👹',out:'#ff5252'}
};
let S,tool='sol',speed=1,last=0,sel=null,pend=null;
function reset(){Object.values(U).forEach(u=>u.cost=Math.round(u.c0*(1-.04*SV.b.disc)));S={money:150+50*SV.b.cash,hp:20+2*SV.b.hp,wave:0,units:[],en:[],q:[],sp:0,fx:[],run:false,over:false,time:0,wt:0,wd:60};document.getElementById('ov').style.display='none';sel=null;pend=null;ui()}
const tools=document.getElementById('tools');
function build(){tools.innerHTML='';const EQ=Object.keys(U).filter(k=>SV.eq.tw.includes(k)||SV.eq.df==k);if(tool&&!EQ.includes(tool))tool=EQ[0];EQ.forEach(k=>{const b=document.createElement('div');b.className='t';b.dataset.k=k;
 b.innerHTML=k=='sell'?'<span style="font-size:20px">🗑</span><b>Продать</b>':`<span style="font-size:20px">${U[k].e}</span><b>${U[k].n}</b>💰${U[k].cost}`;
 b.onclick=()=>{tool=tool===k?null:k;pend=null;ui()};tools.appendChild(b)})}
function ui(){panel();document.getElementById('m').textContent='💰 '+Math.floor(S.money);document.getElementById('h').textContent='🏠 '+S.hp;document.getElementById('w').textContent='Волна '+S.wave;
 [...tools.children].forEach(b=>{const k=b.dataset.k;b.classList.toggle('sel',k==tool);b.classList.toggle('no',k!='sell'&&(U[k].cost>S.money||(U[k].def&&S.units.some(u=>U[u.t].def))))});
 tick()}
document.getElementById('go').onclick=()=>{if(S.over)return;if(!S.wave)startWave();if(S.wave<TOTAL&&(S.br>0||S.wt>=S.wd/2))startWave()};
document.getElementById('sp').onclick=e=>{const L=SPL(),i=L.indexOf(speed);speed=L[(i+1)%L.length];e.target.textContent='x'+speed};
cv.addEventListener('pointerdown',e=>{if(S.over)return;const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*12),y=Math.floor((e.clientY-r.top)/r.height*11);
 const ex=S.units.findIndex(u=>u.x==x&&u.y==y);
 if(ex>=0){pend=null;sel=sel===S.units[ex]?null:S.units[ex]}
 else if(tool&&!pathCells.has(x+','+y)&&!(x==11&&y==7)&&S.money>=U[tool].cost&&!(U[tool].def&&S.units.some(u=>U[u.t].def))){pend={x,y};sel=null}else{sel=null;pend=null}
 ui()});
const TG=['Первый','Последний','Сильный','Ближний'];
function st(u){const b=U[u.t],l=u.lvl-1;return{...b,d:b.d*(1+.5*l),r:b.r*(1+.1*l),rate:b.rate*Math.pow(.92,l)}}
function sell(u){S.money+=u.sp*.6;S.units=S.units.filter(v=>v!=u);if(sel==u)sel=null;ui()}
function upg(){const u=sel,c=Math.round(U[u.t].cost*.7*u.lvl);if(u.lvl<5&&S.money>=c){S.money-=c;u.sp+=c;u.lvl++;ui()}}
function tgt(){sel.tg=(sel.tg+1)%4;ui()}
function panel(){const pn=document.getElementById('pn');
if(pend&&tool!='sell'&&U[tool]){const b=U[tool],s=st({t:tool,lvl:1});pn.style.display='block';pn.innerHTML=`<div class="pt">${b.e} Поставить ${b.n}? 💰${b.cost}</div><div class="ps"><div><i>${b.farm?'Доход':'Урон'}:</i> ${s.d}</div><div><i>Дальность:</i> ${s.r}</div><div><i>Выстр./сек:</i> ${(1/s.rate).toFixed(1)}</div><div><i>${b.farm?'💰/сек':'DPS'}:</i> <b>${(s.d/s.rate).toFixed(1)}</b></div></div><div class="pb" style="grid-template-columns:1fr 1fr"><button class="up" onclick="okPlace()">✅ Поставить</button><button onclick="pend=null;ui()">❌ Отмена</button></div>`;return}
if(!sel||!S.units.includes(sel)){sel=null;pn.style.display='none';return}
const u=sel,b=U[u.t],s=st(u),mx=u.lvl>=5||!!b.def,c=Math.round(b.cost*.7*u.lvl),n=mx?null:st({t:u.t,lvl:u.lvl+1});
const v=(a,f,k)=>f(a)+(n?` <u>→ ${f(n[k]===undefined?a:n[k])}</u>`:'');
const dps=o=>(o.d/o.rate).toFixed(1);
pn.style.display='block';
pn.innerHTML=`<div class="pt">${b.e} ${b.n} · ур. ${u.lvl}/${b.def?10:5}${b.def?' · растёт с волнами':mx?' (макс.)':''}</div><div class="ps">`+
`<div><i>${b.farm?'Доход':'Урон'}:</i> ${s.d.toFixed(0)}${n?` <u>→ ${n.d.toFixed(0)}</u>`:''}</div>`+
`<div><i>Дальность:</i> ${s.r.toFixed(0)}${n?` <u>→ ${n.r.toFixed(0)}</u>`:''}</div>`+
`<div><i>Выстр./сек:</i> ${(1/s.rate).toFixed(1)}${n?` <u>→ ${(1/n.rate).toFixed(1)}</u>`:''}</div>`+
`<div><i>${b.farm?'💰/сек':'DPS'}:</i> <b>${dps(s)}</b>${n?` <u>→ ${dps(n)}</u>`:''}</div>`+
(b.splash?`<div><i>Радиус взрыва:</i> ${b.splash}</div>`:'')+(b.slow?`<div><i>Замедление:</i> ${Math.round((1-b.slow+.0625*(u.lvl-1))*100)}%${n?` <u>→ ${Math.round((1-b.slow+.0625*u.lvl)*100)}%</u>`:''}</div>`:'')+
`</div><div class="pb"><button class="up" ${mx||S.money<c?'disabled':''} onclick="upg()">⬆ Улучшить${mx?'':' 💰'+c}</button>`+
`<button onclick="tgt()">🎯 Цель: ${TG[u.tg]}</button><button class="sl" onclick="sell(sel)">🗑 Продать 💰${Math.floor(u.sp*.6)}</button></div>`}
let TOTAL=15;const fm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),setT=(el,t)=>{if(el.textContent!==t)el.textContent=t};
function okPlace(){if(pend&&tool!='sell'&&U[tool]&&S.money>=U[tool].cost&&!S.units.some(u=>u.x==pend.x&&u.y==pend.y)&&!(U[tool].def&&S.units.some(u=>U[u.t].def))){S.money-=U[tool].cost;S.units.push({x:pend.x,y:pend.y,t:tool,cd:0,lvl:1,tg:0,sp:U[tool].cost})}pend=null;ui()}
function startWave(){if(S.wave>0)S.units.forEach(u=>{if(U[u.t].def&&u.lvl<10)u.lvl++});S.wave++;const n=S.wave,bt=diff==2?BIGT[BIGW.indexOf(n)]:null,boss=n%5==0||!!bt,ST=SETS[diff];S.wd=boss?180:60;S.wt=0;S.br=0;if(n>1)S.money+=40+(n-1)*5;
 let q=[];const c=(a,b)=>{for(let i=0;i<b;i++)q.push(a)},m=boss?2:1;c(ST.a,(4+n*2)*m);c(ST.b,(n>=2?n:0)*m);c(ST.c,Math.floor(n/2)*m);
 q.sort(()=>Math.random()-.5);const gap=S.wd*.8/(q.length+1);q.forEach((t,i)=>S.q.push({t,at:S.time+(i+1)*gap,w:n}));
 if(n==TOTAL)S.q.push({t:ST.f,at:S.time+S.wd*.15,w:n,fin:true});else{if(bt)S.q.push({t:bt,at:S.time+S.wd*.15,w:n});if(n%5==0&&!bt)S.q.push({t:ST.m,at:S.time+S.wd*.15,w:n})}S.run=true;ui()}
function win(){document.getElementById('ov').style.background='rgba(20,120,45,.88)';S.over=true;document.getElementById('ot').textContent='🏆 Победа!\nБаза устояла все '+TOTAL+' волн';document.getElementById('ov').style.display='flex'}
function tick(){const w=document.getElementById('w'),b=document.getElementById('go');
 if(!S.wave){setT(w,'Волна 0/'+TOTAL);setT(b,'▶ Начать волну 1');b.disabled=false;return}
 setT(w,(S.wd>=180?'👑 ':'')+'Волна '+S.wave+'/'+TOTAL+' · '+(S.br>0?'перерыв '+Math.ceil(S.br)+'с':fm(S.wt)));
 if(S.over){b.disabled=true;return}
 if(S.wave>=TOTAL){setT(b,'🏁 Последняя волна');b.disabled=true;return}
 if(S.br>0){setT(b,'⏭ Начать сразу');b.disabled=false;return}
 const left=S.wd/2-S.wt;
 if(left>0){setT(b,'⏭ Пропуск через '+fm(Math.ceil(left)));b.disabled=true}else{setT(b,'⏭ Пропустить к волне '+(S.wave+1));b.disabled=false}}
U.vet={n:'Ветеран',e:'🎖',cost:150,r:110,d:10,rate:.5,col:'#b8860b',def:1};U.rkt={n:'Ракетчик',e:'🚀',cost:260,r:180,d:26,rate:1.6,splash:45,col:'#a33a3a',def:1};
U.fr={n:'Заморозка',e:'❄',cost:130,r:95,d:2,rate:.6,slow:.85,col:'#3d8fbf'};U.farm={n:'Ферма',e:'🌾',cost:100,r:0,d:6,rate:5,farm:1,col:'#9a7b2f'};
const desc=u=>u.farm?`Доход ${u.d}💰 каждые ${u.rate}с`:u.slow?`Замедление ${Math.round((1-u.slow)*100)}% (до 40% на 5 ур.) · дальность ${u.r}`:`Урон ${u.d} · дальность ${u.r} · DPS ${(u.d/u.rate).toFixed(1)}`;
Object.assign(E,{mer:{hp:60,sp:46,rw:11,dm:1,col:'#5d6d7e',s:10,sh:'d'},bike:{hp:45,sp:115,rw:13,dm:1,col:'#d4ac0d',s:11,sh:'d',em:'🏍'},apc:{hp:320,sp:30,rw:30,dm:3,col:'#1f618d',s:16,sh:'r',em:'🛡'},brute:{hp:800,sp:26,rw:90,dm:6,col:'#6e2c00',s:20,sh:'r',em:'🦾',out:'#ff9800'},mech:{hp:1500,sp:22,rw:220,dm:12,col:'#1b2631',s:26,sh:'r',em:'🤖',out:'#ff9800'},imp:{hp:80,sp:55,rw:14,dm:1,col:'#4a148c',s:11,em:'👾',out:'#b36bff'},wraith:{hp:70,sp:135,rw:16,dm:1,col:'#311b92',s:11,em:'👻',out:'#b36bff'},golem:{hp:600,sp:32,rw:40,dm:4,col:'#1a0033',s:18,em:'🌑',out:'#b36bff'},vmini:{hp:1300,sp:30,rw:110,dm:8,col:'#12002b',s:22,em:'🕳',out:'#e040fb'},vlord:{hp:1800,sp:20,rw:600,dm:20,col:'#000',s:30,em:'🌌',out:'#ea80fc'}});
const SETS=[{a:'inf',b:'jeep',c:'tank',m:'boss',f:'boss'},{a:'mer',b:'bike',c:'apc',m:'brute',f:'mech'},{a:'imp',b:'wraith',c:'golem',m:'vmini',f:'vlord'}],BIGT=['boss','mech'];let BIGW=[];
Object.values(U).forEach(u=>u.c0=u.cost);
const MAPS=[
{n:'Ущелье',t:0,k:1.5,p:[[-1,8],[3,8],[3,3],[8,3],[8,7],[11,7]]},
{n:'Прямая',t:0,k:1.5,p:[[-1,5],[6,5],[6,8],[11,8]]},
{n:'Зигзаг',t:1,k:1.25,p:[[-1,1],[9,1],[9,5],[3,5],[3,8],[11,8]]},
{n:'Подкова',t:1,k:1.25,p:[[-1,1],[10,1],[10,9],[1,9],[1,4],[7,4]]},
{n:'Змейка',t:2,k:1,p:[[-1,0],[10,0],[10,2],[1,2],[1,4],[10,4],[10,6],[1,6],[1,8],[10,8],[10,10],[1,10]]},
{n:'Спираль',t:2,k:1,p:[[-1,0],[11,0],[11,10],[0,10],[0,2],[9,2],[9,8],[2,8],[2,4],[7,4]]}];
const TN=['Короткая','Средняя','Длинная'],mlen=m=>m.p.reduce((s,q,i)=>i?s+Math.abs(q[0]-m.p[i-1][0])+Math.abs(q[1]-m.p[i-1][1]):0,0);
function setMap(m){curMap=m;P=m.p;pathCells=new Set();for(let i=0;i<P.length-1;i++){let[a,b]=P[i],[x,y]=P[i+1];let dx=Math.sign(x-a),dy=Math.sign(y-b),cx=a,cy=b;while(true){pathCells.add(cx+','+cy);if(cx==x&&cy==y)break;cx+=dx;cy+=dy}}pts=P.map(([x,y])=>[x*C+C/2,y*C+C/2])}
